<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/standard.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img src="assets/icons/order_app_logo.svg" alt="Bestell App logo" width="90" height="43" />
      <img class="hamburger-icon" src="assets/icons/hamburger_menu_icon.svg" alt="" width="45" height="35" aria-hidden="true" />
    </header>
    <main>
      <section class="hero">
        <picture>
          <source media="(min-width: 520px)" srcset="assets/images/hero_image_desktop.webp" type="image/webp" width="1440" height="508" />
          <img src="assets/images/hero_image_mobile.webp" alt="Spread of gourmet burgers, freshly baked pizza, french fries, and salad served on wooden boards" width="343" height="346" />
        </picture>
        <img class="hero-logo" src="assets/images/burgerhouse_logo.webp" alt="Burgerhouse logo" width="512" height="512" />
      </section>

      <section class="hero-content">
        <div class="hero-heading">
          <h1><span>Burger</span>House</h1>
          <div class="rating">
            <span class="rating-star">★</span>
            <span class="rating-value">4,1</span>
            <span class="rating-count">(317)</span>
          </div>
        </div>
        <p class="hero-tagline">The best of Burgers, Pizza, and Greens, all in one great place.</p>
      </section>

      <div id="menu-container"></div>
    </main>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/template.js"></script>
    <script src="script.js"></script>
  </body>
</html>
